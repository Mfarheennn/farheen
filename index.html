<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First WSL Webpage</title>
    
<style>
    /* This rule must be exactly like this so the background color updates */
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f9; /* Starting background color */
        text-align: center;
        padding: 50px;
        transition: background-color 0.5s ease; /* Makes color change smooth */
    }
    
    .card {
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        display: inline-block;
        margin-top: 100px;
    }
    
    button {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 10px 20px;
        font-size: 16px;
        border-radius: 5px;
        cursor: pointer;
    }
    
    button:hover {
        background-color: #0056b3;
    }
    
    #message-box {
        margin-top: 20px;
        font-weight: bold;
        font-size: 18px;
    }
</style>


</head>
<body>

    <div class="card">
        <h1>Hello World! 👋</h1>
        <p>This page is running from my WSL environment.</p>
        <button onclick="handleInteraction()">Click to interact</button>
        <div id="message-box"></div>
    </div>

    <script src="app.js"></script>

</body>
</html>
